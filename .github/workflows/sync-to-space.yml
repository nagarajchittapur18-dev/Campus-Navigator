name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "nagarajchittapur18@gmail.com"
          git config --global user.name "Nagaraj Chittapur"
          git remote add space https://nagarajchittapur:$HF_TOKEN@huggingface.co/spaces/nagarajchittapur/campus-navigator
          git push --force space main
