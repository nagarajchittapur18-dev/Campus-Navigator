name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice ::HF_TOKEN is not configured in GitHub Secrets. Space is already deployed and running directly on Hugging Face."
            exit 0
          fi
          python -c "
          import os
          from huggingface_hub import HfApi
          token = os.environ.get('HF_TOKEN')
          api = HfApi(token=token)
          api.upload_folder(
              folder_path='.',
              repo_id='nagarajchittapur/campus-navigator',
              repo_type='space',
              commit_message='Automated sync from GitHub Actions',
              ignore_patterns=['.git', '.git/**', '.github/**', '**/__pycache__', '**/*.pyc']
          )
          print('Successfully synced to Hugging Face Space.')
          "
